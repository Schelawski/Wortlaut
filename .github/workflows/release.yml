# Publishes a release when a version tag is pushed:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Builds and tests, stamps the version from the tag into Wortlaut.exe, and creates the GitHub release with
# Wortlaut.exe and its SHA-256 checksum. Release notes come from the matching section of CHANGELOG.md.
# A tag with a suffix (v1.3.0-beta.1) becomes a pre-release; the stable download link
# https://github.com/Schelawski/Wortlaut/releases/latest/download/Wortlaut.exe always points to the newest
# final release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(?<number>\d+\.\d+\.\d+)(?<pre>-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' is not a version like v1.2.3 or v1.2.3-beta.1."
          }
          "version=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT
          "number=$($Matches.number)" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($Matches.pre) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/Wortlaut --configuration Release --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.number }}.0
          -p:FileVersion=${{ steps.version.outputs.number }}.0

      # Code signing (decision in issue #16) goes here, before the checksum is computed.

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Wortlaut.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # Same format as sha256sum: "<hash>  <file name>"
          Set-Content -Path publish/Wortlaut.exe.sha256 -Value "$hash  Wortlaut.exe" -Encoding ascii -NoNewline
          "SHA-256: $hash"

      - name: Release notes
        shell: pwsh
        run: ./.github/scripts/Get-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.version }}' -Path CHANGELOG.md -OutFile release-notes.md

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $arguments = @(
            'release', 'create', $env:TAG,
            'publish/Wortlaut.exe', 'publish/Wortlaut.exe.sha256',
            '--title', "Wortlaut $env:VERSION",
            '--notes-file', 'release-notes.md',
            '--verify-tag'
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
